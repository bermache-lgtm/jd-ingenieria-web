name: Extraer sitio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir zip en la raiz
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -1)
          if [ -z "$ZIP" ]; then echo "Sin zip"; exit 0; fi
          rm -rf /tmp/x && unzip -o -q "$ZIP" -d /tmp/x
          SRC=/tmp/x; if [ -f /tmp/x/jd-ingenieria-web/index.html ]; then SRC=/tmp/x/jd-ingenieria-web; fi
          cp -a "$SRC"/. .
          git rm -q "$ZIP"
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publicar nueva version del sitio"
          git push
